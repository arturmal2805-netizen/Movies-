name: Refresh movie sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'style.css'
      - 'scripts/import_catalog.py'
      - 'scripts/simkl_source.py'
      - 'config/category-rules.json'
      - 'scripts/test_import_catalog.py'
      - '.github/workflows/catalog.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: movie-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test catalog, categories and provider checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          npm test
      - name: Refresh metadata without exposing credentials
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python3 scripts/import_catalog.py
      - name: Commit catalog snapshot
        run: |
          git add data/catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh movie metadata and source status'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Prepare static website
        run: |
          mkdir -p /tmp/nightshift-site/data
          cp mobile-feed.js index.html style.css app.js categories.js category-rules.js taste.js manual-recommendations.js sources.js ratings.js time.js server.js server-config.js .nojekyll /tmp/nightshift-site/
          cp data/catalog.json /tmp/nightshift-site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/nightshift-site
      - uses: actions/deploy-pages@v4
        id: deployment
