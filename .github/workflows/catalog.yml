name: Publish ARTUR logistics
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: artur-logistics-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application and order lifecycle
        run: |
          node --check app.js
          node --check model.js
          npm test
      - name: Package website without legacy integrations
        run: |
          mkdir -p dist
          cp index.html style.css app.js model.js icon.svg apr.avif .nojekyll dist/
          if grep -Eri 'supabase|themoviedb|omdbapi|trakt.tv|simkl.com|sb_publishable|service_role' dist; then
            echo "Unexpected legacy integration in website"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
