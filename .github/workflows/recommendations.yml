name: Nightshift — подбор фильмов каждый час
on:
  workflow_dispatch:
    inputs:
      manual:
        description: 'Run a fresh full search without hourly guards'
        type: boolean
        default: true
      user_id:
        description: 'User UUID (empty runs for all profiles)'
        type: string
        default: ''
      request_id:
        description: 'Website request UUID (leave empty for a GitHub UI run)'
        type: string
        default: ''
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/recommendations.yml'
      - 'config/recommendations.json'
      - 'scripts/recommend.py'
      - 'scripts/recommendation_sources.py'
      - 'scripts/movie_features.py'
      - 'scripts/taste_model.py'
      - 'scripts/synopsis_model.py'
      - 'scripts/production_model.py'
      - 'scripts/imdb_audience.py'
      - 'scripts/imdb_datasets.py'
      - 'scripts/test_imdb_datasets.py'
      - 'scripts/test_imdb_audience.py'
      - 'scripts/audience_priority.py'
      - 'scripts/production_policy.py'
      - 'scripts/interests.py'
      - 'scripts/check_interests_access.py'
      - 'scripts/test_interests.py'
      - 'scripts/test_recommendation_probe.py'
      - 'scripts/probe_recommendations.py'
      - 'scripts/test_production_policy.py'
      - 'scripts/test_audience_priority.py'
      - 'scripts/test_production_model.py'
      - 'scripts/warm_personal_history.py'
      - 'scripts/test_synopsis_model.py'
      - 'scripts/selection_quality.py'
      - 'scripts/test_selection_quality.py'
      - 'scripts/test_search_evidence.py'
      - 'scripts/test_scheduled_personalization.py'
      - 'scripts/test_audience_discovery.py'
      - 'scripts/test_duration_taste.py'
      - 'scripts/test_predictive_taste.py'
      - 'scripts/finish_manual_job.py'
      - 'config/category-rules.json'
      - 'scripts/simkl_source.py'
      - 'scripts/test_recommend*.py'
permissions:
  contents: read
concurrency:
  group: movie-recommendations-${{ github.event_name == 'workflow_dispatch' && (inputs.request_id || 'manual') || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  recommendations:
    name: Hourly personalized recommendations
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MANUAL_RECOMMENDATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.manual || false }}
      RECOMMENDATION_USER_ID: ${{ inputs.user_id || '' }}
      RECOMMENDATION_REQUEST_ID: ${{ inputs.request_id || '' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://tecntqujshynuttfdxhx.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      IMDB_DATASET_PATH: ${{ runner.temp }}/nightshift-imdb/public.db
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test recommendation logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify private interests access
        run: python3 scripts/check_interests_access.py
      - name: Public dataset cache date
        id: imdb-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: imdb-cache
        with:
          path: ${{ runner.temp }}/nightshift-imdb/public.db
          key: imdb-public-v1-${{ steps.imdb-date.outputs.date }}
          restore-keys: imdb-public-v1-
      - name: Prepare public IMDb audience and horror index
        id: imdb-index
        run: python3 scripts/imdb_datasets.py
      - uses: actions/cache/save@v4
        if: ${{ steps.imdb-cache.outputs.cache-hit != 'true' && steps.imdb-index.outputs.fresh == 'true' }}
        with:
          path: ${{ runner.temp }}/nightshift-imdb/public.db
          key: imdb-public-v1-${{ steps.imdb-date.outputs.date }}
      - name: Refresh personal history for the new model
        if: ${{ github.event_name == 'push' }}
        run: python3 scripts/warm_personal_history.py
      - name: Read-only validation of a full candidate batch
        if: ${{ github.event_name == 'push' }}
        env:
          REQUIRE_IMDB_DATASET: 'true'
        run: python3 scripts/probe_recommendations.py
      - name: Add private personalized films
        if: ${{ github.event_name != 'push' }}
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://tecntqujshynuttfdxhx.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MOVIE_FEED_URL: ${{ vars.MOVIE_FEED_URL }}
          MOVIE_FEED_TOKEN: ${{ secrets.MOVIE_FEED_TOKEN }}
        run: python3 scripts/recommend.py
      - name: Report a failed or cancelled website request
        if: ${{ always() && inputs.request_id != '' && (failure() || cancelled()) }}
        run: python3 scripts/finish_manual_job.py
